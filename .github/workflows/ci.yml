# Intégration continue : lint, construction dbt sur un échantillon réel, publication de la
# documentation dbt sur GitHub Pages (branche main uniquement).
#
# Échantillon : les données ne sont jamais versionnées. Le job build télécharge un extrait
# réel avec le script d'ingestion (Côtes-d'Armor, 2 années pour disposer des évolutions N-1),
# ce qui teste aussi le script lui-même.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
  SAMPLE_YEARS: "2024-2025"
  SAMPLE_DEPS: "22"

jobs:
  lint:
    name: Lint (ruff, sqlfluff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Installer les dépendances
        run: uv sync --locked

      - name: Ruff (lint et format)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # Le templater dbt de sqlfluff a besoin des macros des packages (dbt_utils).
      - name: Installer les packages dbt
        working-directory: dbt
        run: uv run dbt deps

      - name: sqlfluff
        run: uv run sqlfluff lint dbt/models dbt/tests

  build:
    name: dbt build (échantillon)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Installer les dépendances
        run: uv sync --locked

      - name: Télécharger l'échantillon DVF
        run: uv run python ingestion/download.py --years "$SAMPLE_YEARS" --deps "$SAMPLE_DEPS"

      - name: Installer les packages dbt
        working-directory: dbt
        run: uv run dbt deps

      - name: dbt build (modèles, tests de données, tests unitaires, export Parquet)
        working-directory: dbt
        run: uv run dbt build

      - name: Générer la documentation dbt
        working-directory: dbt
        run: uv run dbt docs generate --static

      - name: Préparer le site de documentation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p site
          cp dbt/target/static_index.html site/index.html

      - name: Publier l'artefact GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy-docs:
    name: Publier la documentation dbt
    needs: [lint, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6

      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
