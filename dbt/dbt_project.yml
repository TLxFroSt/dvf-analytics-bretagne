name: dvf_bretagne
version: "1.0.0"
config-version: 2
profile: dvf_bretagne

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
snapshot-paths: ["snapshots"]

clean-targets:
  - target
  - dbt_packages

vars:
  # Dossier des CSV DVF téléchargés par ingestion/download.py, relatif au dossier dbt/.
  # Surchargé en CI pour pointer sur un échantillon : --vars '{dvf_raw_path: ...}'
  dvf_raw_path: "../data/raw"

  # Règles de la population prix (docs/kpi-dictionary.md, R4 et R5)
  surface_bati_min_m2: 9          # surface minimale d'un logement décent
  prix_m2_percentile_bas: 0.01    # bornes d'exclusion des valeurs aberrantes,
  prix_m2_percentile_haut: 0.99   # par type de bien × département × année

seeds:
  dvf_bretagne:
    +schema: seeds

models:
  dvf_bretagne:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +schema: marts
      +materialized: table
