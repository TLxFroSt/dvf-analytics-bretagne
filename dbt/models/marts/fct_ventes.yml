models:
  - name: fct_ventes
    description: >
      Table de faits des ventes de logement (règle R3 du dictionnaire des KPI).


      **Grain** : une vente de logement, soit une mutation. Toutes les ventes de logement
      sont présentes, pour les indicateurs de volume ; `est_population_prix` désigne celles
      qui entrent dans les indicateurs de prix (règles R4 et R5).


      Reliée à `dim_date` (par la date), `dim_commune` et `dim_type_bien` (par clés de
      substitution). Exportée en `exports/fct_ventes.parquet`.
    columns:
      - name: vente_key
        description: "Clé de substitution de la vente (hachage de l'identifiant de mutation)."
        data_tests:
          - unique
          - not_null
      - name: id_mutation
        description: "Identifiant DVF de la mutation (dimension dégénérée, pour la traçabilité)."
        data_tests:
          - unique
          - not_null
      - name: date_mutation
        description: "Date de signature de l'acte ; clé vers dim_date."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_jour
      - name: commune_key
        description: "Clé vers dim_commune (commune actuelle de rattachement)."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_commune')
                field: commune_key
      - name: type_bien_key
        description: "Clé vers dim_type_bien."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_type_bien')
                field: type_bien_key
      - name: valeur_fonciere
        description: "Prix déclaré dans l'acte, en euros (TVA comprise le cas échéant, hors frais de notaire)."
      - name: nb_logements
        description: "Nombre de logements vendus ; une vente de plusieurs logements compte pour une vente."
        data_tests:
          - not_null
      - name: nb_dependances
        description: "Nombre de dépendances vendues avec le ou les logements."
      - name: surface_bati_m2
        description: "Surface réelle bâtie du logement, en m² (ventes d'un seul logement)."
      - name: nb_pieces
        description: "Nombre de pièces principales du logement (ventes d'un seul logement)."
      - name: surface_terrain_m2
        description: "Surface totale des parcelles vendues, en m²."
      - name: prix_m2
        description: "Prix au m² bâti, en €/m² (ventes d'un seul logement de valeur et de surface valides)."
      - name: est_population_prix
        description: "Vrai si la vente entre dans les indicateurs de prix (règles R4 et R5)."
        data_tests:
          - not_null
      - name: motif_exclusion_prix
        description: "Motif d'exclusion des indicateurs de prix ; nul pour les ventes retenues."
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - "plusieurs_logements"
                  - "valeur_absente"
                  - "surface_insuffisante"
                  - "prix_m2_aberrant"
      - name: tranche_surface
        description: "Tranche de surface bâtie, pour la page Typologie. Trier par tranche_surface_ordre."
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - "Moins de 30 m²"
                  - "30 à 49 m²"
                  - "50 à 69 m²"
                  - "70 à 89 m²"
                  - "90 à 119 m²"
                  - "120 à 149 m²"
                  - "150 m² et plus"
      - name: tranche_surface_ordre
        description: "Clé de tri de la tranche de surface (1 à 7)."
      - name: tranche_pieces
        description: "Tranche de nombre de pièces principales. « Non renseigné » pour 0 pièce déclarée. Trier par tranche_pieces_ordre."
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - "1 pièce"
                  - "2 pièces"
                  - "3 pièces"
                  - "4 pièces"
                  - "5 pièces"
                  - "6 pièces et plus"
                  - "Non renseigné"
      - name: tranche_pieces_ordre
        description: "Clé de tri de la tranche de pièces (1 à 6, 9 pour non renseigné)."
      - name: tranche_prix_m2
        description: "Tranche de 250 €/m², la dernière ouverte à 8 000 €/m² et plus. Renseignée pour la population prix uniquement. Trier par tranche_prix_m2_ordre."
      - name: tranche_prix_m2_ordre
        description: "Borne basse de la tranche de prix au m², en €/m² ; clé de tri."
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 8000
